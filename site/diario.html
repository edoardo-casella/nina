<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario di bordo · Everywaves</title>
<meta name="description" content="Il diario di bordo della crociera Estate 2026 di S/Y Nina: la cronaca giorno per giorno, scritta come va scritta — con i fatti e con l'ironia.">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0A1424">
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap"></noscript>
<style>
:root{
  --paper:#FBFDFF; --sea-1:#EEF4F9; --sea-2:#D8E4EE; --panel:#FFFFFF;
  --ink:#0B1320; --soft:#3E556B; --hair:#C4D2DF; --accent:#006B9F; --gold:#B8860B; --gold-2:#E5C158; --verde:#0A7A43; --rosso:#C0392B;
  --display:"IBM Plex Sans Condensed",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#070E1A; --sea-1:#101E33; --sea-2:#1C3552; --panel:#0C1728;
  --ink:#DCE7F5; --soft:#8299B4; --hair:#22384F; --accent:#35C4E7; --gold:#E5C158; --gold-2:#FBE7A8; --verde:#2FBF71; --rosso:#E2536F;
}}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;border-left:1px solid var(--hair);border-right:1px solid var(--hair);min-height:100vh}
.wrap{max-width:720px;margin:0 auto}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--paper) 88%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--hair)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1.1rem}
.back{font:700 .66rem/1 var(--display);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--soft)}
.top .tag{font:700 .66rem/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
section{padding:0 1.1rem 1.6rem}
/* hero (stesso idioma di aneddoti.html) */
.ahero{padding:1.6rem 1.1rem .2rem}
.ahero .yr{font:700 .62rem/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.ahero h1{font:700 2.2rem/1.02 var(--display);letter-spacing:.01em;margin:.35rem 0 .2rem}
.ahero .sub{color:var(--soft)}
/* giorno: pannello con timbro e badge, timeline di voci orarie */
.giorno{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--hair);
  border-left:3px solid var(--gold);border-radius:4px;padding:1.05rem 1.1rem;margin:1.1rem 0}
.giorno .stamp{position:absolute;top:.8rem;right:.7rem;transform:rotate(7deg);border:2px solid var(--verde);
  color:var(--verde);font:700 .56rem/1 var(--display);letter-spacing:.16em;text-transform:uppercase;
  padding:.24rem .45rem;border-radius:3px;opacity:.8}
.giorno .gnum{font:700 .6rem/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.giorno h2{font:700 1.28rem/1.15 var(--display);margin:.3rem 0 .55rem;text-transform:capitalize;padding-right:5rem}
.gbadges{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.85rem}
.gbadges .db{font:600 .68rem/1 var(--mono);color:var(--soft);border:1px solid var(--hair);border-radius:99px;
  padding:.32rem .6rem;background:var(--sea-1)}
.gbadges .db b{font-weight:700;color:var(--ink)}
.tl{border-top:1px dashed var(--hair);padding-top:.8rem}
.tl .entry{display:flex;gap:.75rem;margin-bottom:.7rem}
.tl .tt{flex:none;width:4.6rem;font:700 .74rem/1.6 var(--mono);color:var(--accent);text-align:right}
.tl .tx{flex:1;border-left:1px solid var(--hair);padding-left:.75rem}
.tl .tx p{font-size:.94rem;line-height:1.65;margin-bottom:.55rem}
.tl .tx p:last-child{margin-bottom:0}
footer{display:block;padding:1.8rem 1.1rem 3rem;text-align:center;color:var(--soft);font-size:.85rem}
footer a.pl{display:inline-block;margin-top:1rem;font:700 .66rem/1 var(--display);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--soft);border:1px solid var(--hair);padding:.6rem 1rem;border-radius:99px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <a class="back" href="index.html">‹ Plancia</a>
  <span class="tag">📔 Diario di bordo</span>
</div></div>
<main id="app"></main>

<script>
const esc = s => String(s ?? "").replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));
// giorno della settimana calcolato dalla data, mai memorizzato nel JSON
const dataName = d => new Date(d + "T12:00").toLocaleDateString("it-IT",
  { weekday: "long", day: "numeric", month: "long" });
// vento/mare/miglia possono essere null (in attesa di compilazione): si mostra ___
const badge = (lab, val) =>
  `<span class="db"><b>${lab}</b> ${val != null && val !== "" ? esc(val) : "___"}</span>`;

function dayBlock(g){
  return `<div class="giorno" id="g${g.day}">
    ${g.status === "in-progress" ? `<span class="stamp">In corso</span>` : ""}
    <div class="gnum">Giorno ${g.day}</div>
    <h2>${esc(dataName(g.date))}</h2>
    <div class="gbadges">
      ${badge("Rotta", g.route)}
      ${badge("Vento", g.wind)}
      ${badge("Mare", g.sea)}
      ${badge("Miglia", g.nm != null ? g.nm + " nm" : null)}
    </div>
    <div class="tl">${(g.entries || []).map(e =>
      `<div class="entry"><span class="tt">${esc(e.time)}</span><div class="tx">${e.html}</div></div>`
    ).join("")}</div>
  </div>`;
}

fetch("data/diario.json", { cache: "no-cache" }).then(r => r.json()).then(d => {
  document.getElementById("app").innerHTML =
    `<div class="ahero"><div class="yr">Registro di bordo · narrativo</div>
      <h1>${esc(d.title)}</h1>
      <div class="sub">${d.sub || ""}</div></div>
    <section>${(d.days || []).slice().sort((a, b) => a.day - b.day).map(dayBlock).join("")}</section>
    <footer><a class="pl" href="index.html">‹ Torna alla Plancia Niña</a></footer>`;
}).catch(() => { document.getElementById("app").innerHTML =
  `<section><p style="padding:2rem 0">Diario non disponibile offline.</p></section>`; });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
<script src="nav.js"></script>
</body>
</html>
