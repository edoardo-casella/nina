<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">

<style>
:root{
  --paper:#FBFDFF; --sea-1:#EEF4F9; --sea-2:#D8E4EE; --panel:#FFFFFF;
  --ink:#0B1320; --soft:#3E556B; --hair:#C4D2DF; --accent:#006B9F; --gold:#B8860B; --gold-2:#E5C158; --verde:#0A7A43;
  --display:"IBM Plex Sans Condensed",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#070E1A; --sea-1:#101E33; --sea-2:#1C3552; --panel:#0C1728;
  --ink:#DCE7F5; --soft:#8299B4; --hair:#22384F; --accent:#35C4E7; --gold:#E5C158; --gold-2:#FBE7A8; --verde:#2FBF71;
}}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;border-left:1px solid var(--hair);border-right:1px solid var(--hair);min-height:100vh}
.wrap{max-width:720px;margin:0 auto}
a{color:var(--accent)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--paper) 88%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--hair)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;padding:.6rem 1.1rem}
.back{font:700 .66rem/1 var(--display);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--soft)}
.top .tag{font:700 .66rem/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
section{padding:0 1.1rem 1.6rem}
h2{font:700 .74rem/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--soft);
  margin:1.5rem 0 1rem;display:flex;align-items:center;gap:.55rem;border-left:3px solid var(--gold);padding-left:.55rem}
h2::after{content:"";flex:1;height:1px;background:var(--hair)}
/* hero membro */
.mhero{padding:1.6rem 1.1rem 0;display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
.mphoto{width:132px;height:176px;flex:none;border-radius:8px;object-fit:cover;background:var(--sea-2);box-shadow:0 8px 22px rgba(0,0,0,.25)}
.mph-ph{width:132px;height:176px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font:700 3.4rem/1 var(--display);color:#fff;background:linear-gradient(150deg,var(--accent),var(--sea-2))}
.mhd{flex:1;min-width:11rem}
.mhd .role{font:700 .62rem/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.mhd h1{font:700 2.2rem/1.02 var(--display);letter-spacing:.01em;margin:.35rem 0 .2rem}
.mhd .nick{color:var(--soft);font-style:italic}
.badge{display:inline-flex;align-items:center;gap:.3rem;margin-top:.6rem;font:700 .62rem/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:.32rem .7rem}
.badge.vet{color:var(--gold);border:1px solid var(--gold)}
.badge.rookie{color:var(--accent);border:1px solid var(--accent)}
.rankrow{margin-top:.55rem}
.rankbadge{display:inline-flex;align-items:center;gap:.35rem;font:700 .6rem/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);border:1px solid var(--hair);border-radius:99px;padding:.28rem .6rem .28rem .4rem}
.rankbadge b{font-weight:700}
.rankbadge.cmd{color:var(--gold);border-color:var(--gold)}
.rankbadge.abil{color:var(--gold);border-color:var(--gold);border-style:dashed}
svg.ins{height:1.5em;width:2.4em;display:block;overflow:visible;flex:none}
.rankprog{margin-top:.5rem;max-width:16rem}
.rankprog .rp-bar{height:7px;background:var(--sea-2);border-radius:5px;overflow:hidden;border:1px solid var(--hair)}
.rankprog .rp-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));border-radius:5px}
.rankprog .rp-cap{margin-top:.3rem;font:700 .58rem/1.3 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
.rankprog .rp-cap b{color:var(--gold)}
/* stats */
.mstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:6px;overflow:hidden;margin-top:1.3rem}
.mstat{background:var(--panel);padding:.9rem .4rem;text-align:center}
.mstat b{display:block;font:700 1.5rem/1 var(--mono);color:var(--ink)}
.mstat i{display:block;font:700 .52rem/1.3 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--soft);font-style:normal;margin-top:.4rem}
.card{background:var(--panel);border:1px solid var(--hair);border-left:3px solid var(--accent);border-radius:5px;padding:.9rem 1rem;font-size:.94rem;line-height:1.6}
.card.note{border-left-color:var(--gold)}
.plink{color:inherit;text-decoration:none;border-bottom:1px dotted var(--accent)}
.plink:hover{color:var(--accent)}
.flag{width:22px;height:14px;border-radius:2px;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.18);vertical-align:-2px;margin-right:.1rem}
.card.bio{border-left-color:var(--gold)}
.card.bio .epithet{display:block;font:700 .62rem/1.3 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem}
.tlog{display:flex;flex-direction:column;gap:.4rem}
.tlrow{display:flex;align-items:center;gap:.55rem;background:var(--panel);border:1px solid var(--hair);border-radius:7px;padding:.55rem .7rem;text-decoration:none;color:inherit}
.tlrow:hover{border-color:var(--accent)}
.tlrow .fl{flex:none;display:inline-flex;align-items:center}
.tlrow .z{flex:1;min-width:0}
.tlrow .z b{display:block;font-size:.92rem}
.tlrow .z small{color:var(--soft);font-size:.76rem}
.tlrow .y{font:700 .82rem/1 var(--mono);color:var(--soft);flex:none}
.tlrow .go{color:var(--soft);font-weight:700}
.pace{flex:none;font:700 .54rem/1 var(--display);letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:.28rem .5rem}
.pace.chill{background:rgba(47,191,113,.16);color:var(--verde)}
.pace.cruise{background:rgba(0,107,159,.15);color:var(--accent)}
.pace.push{background:rgba(184,134,11,.18);color:var(--gold)}
.pace.extreme{background:rgba(197,48,48,.16);color:#C53030}
/* tag di profilo */
.mtags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1rem}
.mtag{font:700 .6rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--sea-2);color:var(--accent);border-radius:99px;padding:.42rem .7rem}
/* companions */
.cchips{display:flex;flex-wrap:wrap;gap:.5rem}
.cchip{display:inline-flex;align-items:center;gap:.5rem;background:var(--panel);border:1px solid var(--hair);border-radius:99px;padding:.24rem .8rem .24rem .28rem;text-decoration:none;color:inherit}
.cchip:hover{border-color:var(--accent)}
.cchip .cav{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:var(--sea-2);display:flex;align-items:center;justify-content:center;font:700 .9rem/1 var(--display);color:#fff}
.cchip .cn{font-weight:600;font-size:.88rem;line-height:1.12}
.cchip .cn small{display:block;font:400 .68rem/1.2 var(--body);color:var(--soft)}
/* oroscopo di bordo */
.zsign{display:flex;align-items:center;gap:.7rem;padding:.9rem 1rem;background:var(--panel);border:1px solid var(--hair);border-radius:8px;margin-bottom:.7rem}
.zsign .ze{font-size:2rem;line-height:1}
.zsign b{display:block;font-size:1rem}
.zsign small{color:var(--soft);font-size:.82rem}
.oscdays{display:flex;flex-direction:column;gap:.5rem}
.oscday{background:var(--panel);border:1px solid var(--hair);border-radius:6px;padding:.7rem .9rem}
.oscday .od-date{font:700 .6rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:.4rem}
.oscday .od-row{display:flex;flex-wrap:wrap;gap:.4rem 1rem;font-size:.85rem;margin-top:.25rem}
.oscday .od-row b{color:var(--soft);font-weight:700;font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;margin-right:.35rem}
.oscdays.clip .oscday:nth-child(n+4){display:none}
.zcompat{margin-top:.9rem}
.zcompat>b{font:700 .6rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.q-empty{background:var(--sea-1);border:1px dashed var(--hair);border-radius:5px;padding:1rem;color:var(--soft);font-size:.9rem;text-align:center}
.q-empty a{font-weight:600}
.qrow{display:grid;grid-template-columns:7.5rem 1fr;gap:.5rem;padding:.5rem 0;border-bottom:1px solid var(--hair);font-size:.92rem}
.qrow:last-child{border-bottom:0}
.qrow b{font:700 .58rem/1.3 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
/* ciurma 2026: griglia intera (niente scroll orizzontale) + galleria */
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:.8rem .5rem;padding:.3rem 0 .6rem}
.strip a{text-align:center;text-decoration:none;color:var(--soft)}
.strip .av{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--sea-2);display:flex;align-items:center;justify-content:center;font:700 1.2rem/1 var(--display);color:#fff;margin:0 auto .25rem}
.strip small{font-size:.64rem;display:block;line-height:1.15}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.8rem}
.pgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.7rem}
.pgal figure{margin:0;cursor:zoom-in}
.pgal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block;background:var(--sea-2)}
.pgal figcaption{margin-top:.28rem;font:700 .56rem/1.3 var(--display);letter-spacing:.06em;text-transform:uppercase}
.pgal figcaption a{color:var(--soft);text-decoration:none}
.pgal figcaption a:hover{color:var(--accent)}
/* galleria compatta: max ~3 righe desktop / 4 mobile, il resto dietro "Mostra tutte" */
.pgal.clip figure:nth-child(n+13){display:none}
@media(max-width:560px){.pgal.clip figure:nth-child(n+9){display:none}}
.cm-toggle{display:inline-flex;align-items:center;gap:.45rem;margin-top:.9rem;background:var(--panel);border:1px solid var(--hair);color:var(--soft);
  font:700 .64rem/1 var(--display);letter-spacing:.12em;text-transform:uppercase;padding:.55rem .95rem;border-radius:99px;cursor:pointer}
.cm-toggle:hover{border-color:var(--accent);color:var(--accent)}
.cm-toggle .chev{font-size:.72em;transition:transform .15s}
.cm-toggle .chev.up{transform:rotate(180deg)}
.m-only{display:none!important}
@media(max-width:560px){.m-only{display:inline-flex!important}}
.mcard{background:var(--panel);border:1px solid var(--hair);border-radius:8px;overflow:hidden;text-decoration:none;color:inherit;display:block}
.mcard .ph{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--sea-2);display:flex;align-items:center;justify-content:center;font:700 2.6rem/1 var(--display);color:#fff}
.mcard .b{padding:.6rem .7rem}
.mcard .b b{display:block;font-size:.95rem}
.mcard .b span{font:700 .56rem/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.mcard .b .vt{color:var(--gold)} .mcard .b .rk{color:var(--accent)}
footer{display:block;padding:1.8rem 1.1rem 3rem;text-align:center;color:var(--soft);font-size:.85rem}
footer a.pl{display:inline-block;margin-top:1rem;font:700 .66rem/1 var(--display);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--soft);border:1px solid var(--hair);padding:.6rem 1rem;border-radius:99px}
.zoom{cursor:zoom-in}
#lb{position:fixed;inset:0;z-index:80;background:rgba(3,7,14,.95);display:none;align-items:center;justify-content:center}
#lb.on{display:flex}
#lb img{max-width:96vw;max-height:90vh;object-fit:contain;border-radius:4px}
#lb .x{position:absolute;top:.7rem;right:1rem;color:#fff;font-size:1.9rem;background:none;border:0;cursor:pointer;line-height:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.ctaform{margin:.2rem 0 1rem;display:flex;flex-wrap:wrap;gap:.5rem}
.ctabtn{display:inline-block;background:var(--sea-1);border:1px solid var(--hair);border-radius:7px;padding:.55rem .9rem;font-weight:600;font-size:.88rem}
.srows{display:flex;flex-direction:column;gap:.35rem;margin-top:.6rem}
.srow{display:flex;align-items:center;gap:.6rem;background:var(--panel);border:1px solid var(--hair);border-radius:7px;padding:.45rem .6rem;color:inherit;text-decoration:none}
.srow:hover{border-color:var(--accent)}
.srow .pos{font:700 .72rem/1 var(--display);color:var(--soft);min-width:1.7rem;text-align:right}
.srow .cav{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--sea-2);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.srow .sn{flex:1;min-width:0}.srow .sn b{display:block;font-size:.9rem}.srow .sn small{color:var(--soft);font-size:.72rem}
.srow .sins .ins{display:block;height:16px;width:28px;overflow:visible}
.srow .srk{font:700 .58rem/1.2 var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--soft);text-align:right;max-width:6.5rem}
.qhint{margin:-.2rem 0 .55rem;font-size:.85rem;color:var(--soft)}
.qchips{display:flex;flex-wrap:wrap;gap:.45rem}
.qchip{display:inline-flex;align-items:center;gap:.4rem;background:var(--panel);border:1px solid var(--hair);border-radius:99px;padding:.42rem .75rem;cursor:pointer;font:600 .8rem/1 var(--body);color:inherit}
.qchip:hover{border-color:var(--accent)}
.qchip.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.qchip .qn{font:700 .68rem/1 var(--display);color:var(--soft);background:var(--sea-2);border-radius:99px;padding:.16rem .4rem}
.qchip.on .qn{color:var(--accent)}
.qchip .qn:empty{display:none}
/* tab Profilo / Il tuo viaggio */
.mtabs{display:flex;gap:.5rem;padding:1.2rem 1.1rem 0}
.mtabs a{font:700 .64rem/1 var(--display);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--soft);border:1px solid var(--hair);border-radius:99px;padding:.55rem .95rem;display:inline-flex;align-items:center;gap:.4rem}
.mtabs a:hover{border-color:var(--accent);color:var(--accent)}
.mtabs a.on{border-color:var(--accent);background:var(--accent);color:#fff}
/* righe del riepilogo viaggio */
.vrow{display:flex;align-items:baseline;gap:.6rem;padding:.5rem 0;border-bottom:1px solid var(--hair);font-size:.92rem}
.vrow:last-child{border-bottom:0}
.vrow .vl{flex:1;min-width:0}
.vrow .vl small{display:block;color:var(--soft);font-size:.78rem}
.vrow .va{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.vrow .va.pos{color:var(--verde)}
.vrow.vtot{border-top:2px solid var(--hair);font-weight:700}
.vbig{font:700 1.7rem/1.2 var(--mono);font-variant-numeric:tabular-nums}
.card.vsaldo{border-left-color:var(--gold)}
.card.vsaldo.ok{border-left-color:var(--verde)}
.vrow.vtx{align-items:center}
.tav{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;background:var(--sea-2);display:inline-flex;align-items:center;justify-content:center;font:700 .85rem/1 var(--display);color:#fff}
a.tavl{flex:none;display:inline-flex;text-decoration:none}
.paybtn{display:inline-flex;align-items:center;gap:.45rem;background:#0070BA;color:#fff;font:700 .68rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;padding:.65rem 1rem;border-radius:99px}
.paybtn:hover{filter:brightness(1.12)}
</style>

<body>
<div class="top"><div class="wrap">
  <a class="back" href="index.html">‹ Plancia</a>
  <span class="tag">👥 La ciurma</span>
</div></div>
<main id="app"></main>
<div id="lb"><button class="x" aria-label="chiudi">✕</button><img alt=""></div>

<script>
const esc = s => String(s ?? "").replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));
const nfmt = n => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
// bandiere + zona per il log viaggi (stessa logica di viaggio.html)
const CC = { Greece: "gr", Croazia: "hr", Spain: "es", Italy: "it", France: "fr", Cuba: "cu", Seychelles: "sc", "Saint Vincent": "vc", "Saint Lucia": "lc", Turkey: "tr" };
const partsC = c => (c || "").split(/[-&]/).map(x => x.trim()).filter(Boolean);
const flag1 = c => CC[c] ? `<img class="flag" src="skipper/flags/${CC[c]}.svg" alt="${esc(c)}">` : "";
const flags = country => partsC(country).map(flag1).join("");
const cleanZone = z => (z || "").replace(/\s*-\s*(GR|SP|IT|TR|FR)\s*$/i, "").replace(/\s+CZ$/i, "").trim();
function pace(a) {  // livello di attività = ritmo nm/giorno (come nel dossier skipper)
  if (a == null) return null;
  if (a < 18) return { k: "chill", t: "Chilling" };
  if (a < 30) return { k: "cruise", t: "Crociera" };
  if (a < 40) return { k: "push", t: "Spinto" };
  return { k: "extreme", t: "Estremo" };
}
function tripRow(t) {
  const personalNm = t.pnm != null ? t.pnm : t.nm;
  const personalDays = t.pdays != null ? t.pdays : t.days;
  const avg = personalDays ? Math.round(personalNm / personalDays) : null, p = pace(avg);
  const bn = BOATNAME.get(t.id);                       // nome barca da trips.json
  const boatTxt = (bn ? `«${esc(bn)}»${t.boat ? " · " : ""}` : "") + esc(t.boat || "");
  const dur = t.days ? `${t.days} ${t.days === 1 ? "giorno" : "giorni"}` : "";   // durata del viaggio
  const aboard = (t.pdays != null && t.days && t.pdays < t.days) ? ` · a bordo ${t.pdays} gg` : ""; // giorni a bordo di questa persona (se < viaggio)
  return `<a class="tlrow" href="viaggio.html#${t.id}"><span class="fl">${flags(t.country) || "⚓"}</span>` +
    `<span class="z"><b>${esc(cleanZone(t.zone) || t.country || "")}</b>` +
    `<small>${boatTxt}${personalNm ? ` · ${personalNm} nm personali` : ""}${dur ? ` · ${dur}` : ""}${aboard}</small></span>` +
    `${p ? `<span class="pace ${p.k}">${p.t}</span>` : ""}<span class="y num">${t.year || ""}</span><span class="go">›</span></a>`;
}
function fleetRow(f) {   // viaggio in cui la persona era su UN'ALTRA barca (in flotta), non a bordo con noi
  return `<a class="tlrow" href="viaggio.html#${f.id}"><span class="fl">${flags(f.country) || "🚩"}</span>` +
    `<span class="z"><b>${esc(cleanZone(f.zone) || f.country || "")}</b>` +
    `<small>${f.fleetBoat ? `«${esc(f.fleetBoat)}» · ` : ""}${esc(f.note || "Su un'altra barca")}${f.name ? ` · in flotta con «${esc(f.name)}»` : ""}</small></span>` +
    `<span class="y num">${f.year || ""}</span><span class="go">›</span></a>`;
}
// aneddoti taggati con questa persona (link alla pagina Aneddoti)
const anecFor = id => (ANEC || []).filter(a => (a.people || []).includes(id));
function anecRow(a) {
  const fl = flags(a.country);   // bandiere = SVG locali (le emoji su Windows rendono come "GR/ES/IT")
  const meta = (a.meta || "").replace(a.flag || "␀", "").replace(/^\s*[·•]\s*/, "").trim();

function zodiacSection(m, bd, q, all) {
  const Z = window.ninaZodiac;
  const sign = Z && Z.signFromMd(q.birth_md);
  if (!sign) return "";
  const meta = Z.SIGN_META[sign];
  const todayIso = new Date().toISOString().slice(0, 10);

  let daysHtml = "";
  if (bd) {
    const days = [];
    for (let d = day(bd.b); d <= day(bd.l); d.setDate(d.getDate() + 1)) days.push(d.toISOString().slice(0, 10));
    const rows = days.map(iso => {
      const h = Z.dayHoroscope(sign, iso);
      return `<div class="oscday"><div class="od-date">${fmtS(iso)}${iso === todayIso ? " · oggi" : ""}</div>
        <div class="od-row"><span><b>Numeri</b>${h.numeri.join(" · ")}</span><span><b>${h.umore[0]}</b>${esc(h.umore[1])}</span></div>

        <div class="od-row"><span><b>Evita</b>${esc(h.evitare)}</span></div>
      </div>`;
    }).join("");
    daysHtml = `<div class="oscdays${days.length > 3 ? " clip" : ""}" id="oscdays">${rows}</div>` +
      (days.length > 3 ? `<button class="cm-toggle" type="button" data-label="Mostra tutti i giorni (${days.length})" data-target="oscdays" onclick="toggleClip(this)">Mostra tutti i giorni (${days.length}) <span class="chev">▾</span></button>` : "");
  }

  // compatibilità: chi altro è a bordo con periodo sovrapposto e ha un segno noto
  let compatHtml = "";
  if (bd && PRIV && PRIV.profiles) {
    const mates = all.filter(x => x.id !== m.id && x.crew2026 && x.crew2026.board && x.crew2026.leave
      && x.crew2026.board <= bd.l && x.crew2026.leave >= bd.b)
      .map(x => {
        const xsign = Z.signFromMd((PRIV.profiles[x.id] || {}).birth_md);
        return xsign ? { x, xsign, comp: Z.compatibility(sign, xsign) } : null;
      }).filter(Boolean);
    if (mates.length) {
      compatHtml = `<div class="zcompat"><b>In sintonia a bordo</b><div class="cchips" style="margin-top:.5rem">` +

        `</div></div>`;
    }
  }

  return `<h2>🔮 Oroscopo di bordo</h2>
    <div class="zsign"><span class="ze">${meta.emoji}</span><div><b>${meta.label}</b><small>${esc(meta.boat)}</small></div></div>

// progressione verso il grado successivo (barra %), DENTRO la propria carriera
function rankProgHTML(m) {
  if (m.pet) return "";
  if (m.track === "abilitato") return `<div class="rankprog"><div class="rp-cap">Patente conseguita &middot; in attesa del primo comando</div></div>`;
  const L = GRADES[m.track] || GRADES.marinaio, days = m.days || 0;
  let i = 0; for (let k = 0; k < L.length; k++) if (days >= L[k][0]) i = k;
  const next = L[i + 1] || null;
  if (!next) return `<div class="rankprog"><div class="rp-bar"><i style="width:100%"></i></div><div class="rp-cap">${m.track === "comandante" ? "Comando al vertice ⚓" : "Vertice della carriera d'equipaggio"}</div></div>`;
  const cur = L[i];
  const pct = Math.max(3, Math.min(100, Math.round((days - cur[0]) / (next[0] - cur[0]) * 100)));
  const toNext = Math.max(0, Math.ceil(next[0] - days));
  return `<div class="rankprog"><div class="rp-bar"><i style="width:${pct}%"></i></div><div class="rp-cap">${pct}% &middot; ancora <b>${toNext} ${toNext === 1 ? "giorno" : "giorni"}</b> a ${esc(next[2])}</div></div>`;
}

// nome pubblico), iniziale come fallback, ancora per il Broker; se la persona
// ha una pagina, la faccia la apre
function counterAv(name) {
  const p = DATA.find(x => x.name === name);
  const av = p && photoOf(p)
    ? `<img class="tav" src="${photoOf(p)}" alt="${esc(name)}" loading="lazy">`
    : `<span class="tav">${name === "Broker" ? "⚓" : esc((name || "?").trim()[0].toUpperCase())}</span>`;
  const href = p ? ((p.crew2026 && p.crew2026.link) || `#${p.id}`) : null;
  return href ? `<a class="tavl" href="${href}" title="${esc(name)}">${av}</a>` : av;
}

function viaggioPage(m) {
  return `
  <div class="mhero">
    ${photoOf(m) ? `<img class="mphoto zoom" src="${photoOf(m)}" alt="${esc(m.name)}" onclick="lbOne('${photoOf(m)}')">` : avatarP(m, "mph-ph")}
    <div class="mhd">
      <div class="role">🧳 Il tuo viaggio · Estate 2026</div>
      <h1>${esc(m.name)}</h1>
      <div class="nick">Cabina, quota, extra e pagamenti — il riepilogo personale della crociera.</div>
    </div>
  </div>
  ${tabBar(m, "viaggio")}
  <section id="vwrap"><div class="q-empty" style="margin-top:1.4rem">Un attimo — controllo chi sei…</div></section>
  <footer><a class="pl" href="#${m.id}">‹ Torna al profilo</a></footer>`;
}

async function loadViaggio(m) {
  const box = document.getElementById("vwrap");
  const lock = h => { box.innerHTML = `<div class="q-empty" style="margin-top:1.4rem">${h}</div>`; };
  if (!window.ninaAuth || !ninaAuth.enabled) return lock("🔐 Il riepilogo del viaggio è riservato — l'area equipaggio apre a breve.");
  try {
    const { session, member } = await ninaAuth.me();
    if (!session) return lock(`🔐 Cabina, quota e pagamenti sono riservati.<br><a href="login.html">Accedi all'area equipaggio ›</a>`);
    if (!member || member.status !== "approved") return lock(`Il tuo accesso non è ancora abilitato — <a href="login.html">dettagli ›</a>`);
    const own = member.crew_id === m.id, admin = member.role === "admin";
    if (!own && !admin) return lock(`🔐 Questa sezione è riservata a ${esc(m.name)}. Il tuo riepilogo è nella <a href="membro.html#${esc(member.crew_id)}/viaggio">tua pagina ›</a>`);
    const row = await ninaAuth.finance(m.id);
    if (!row) return lock(`Il riepilogo non è ancora stato pubblicato — riprova più tardi.`);
    box.innerHTML = renderViaggio(row.payload, row.updated_at, admin && !own);
  } catch (err) { lock("L'area riservata non risponde — riprova tra un attimo."); }
}

function renderViaggio(p, ts, adminView) {
  const d = p.dates || {}, t = p.totals || {}, b = p.boat || {};
  const weeks = (d.weeks || []).map(w => `settimana ${w.n} (${fmtS(w.from)} – ${fmtS(w.to)})`).join(", ");
  const cabins = (p.cabins || []).map(c => `<div class="vrow"><span class="vl"><b>${esc(c.cabin)}</b>${c.type && c.type !== c.cabin ? ` · ${esc(c.type)}` : ""}<small>dal ${fmt(c.from)} al ${dayAfter(c.to)} · ${c.nights} ${c.nights === 1 ? "notte" : "notti"}${(c.shared_with || []).length ? ` · con ${c.shared_with.map(esc).join(" e ")}` : " · tutta per te"}</small></span></div>`).join("");
  const extras = (p.extras || []).map(x => `<div class="vrow"><span class="vl"><b>${esc(x.name)}</b><small>${x.note ? `${esc(x.note)} · ` : ""}${esc(x.criterion || "")} · totale ${eur(x.total)}</small></span><span class="va">${eur(x.share)}</span></div>`).join("");
  const txs = (p.transactions || []).map(x => `<div class="vrow vtx">${counterAv(x.counterpart)}<span class="vl"><b>${x.direction === "in" ? "Ricevuto da" : "Versato a"} ${esc(x.counterpart)}</b><small>${esc(x.kind || "Movimento")}${x.date ? ` · ${fmt(x.date)}` : ""}${x.note ? ` · ${esc(x.note)}` : ""}</small></span><span class="va${x.direction === "in" ? " pos" : ""}">${x.direction === "in" ? "+" : "−"}${eur(x.amount)}</span></div>`).join("");
  const saldo = Number(t.saldo) || 0, deltaBarca = Number(t.delta_da_versare) || 0;
  // PayPal.Me con importo pre-compilato: chi paga sceglie "amici e familiari"
  // nella schermata PayPal (il link non puo' forzarlo)
  const payUrl = `https://www.paypal.me/EdoardoCasella/${saldo.toFixed(2)}EUR`;
  const saldoCard = Math.abs(saldo) < 0.01
    ? `<div class="card vsaldo ok">✅ <b>Tutto in regola</b> — non devi versare altro.</div>`
    : saldo > 0
      ? `<div class="card vsaldo">Ti restano da versare <b class="num">${eur(saldo)}</b>${deltaBarca > 0.005 ? `, di cui quota barca ${eur(deltaBarca)}` : ""}.
        <div style="margin-top:.75rem"><a class="paybtn" href="${payUrl}" target="_blank" rel="noopener">Paga ${eur(saldo)} con PayPal</a></div>
        <small style="display:block;margin-top:.5rem;color:var(--soft)">Nella schermata PayPal scegli <b>«amici e familiari»</b> (niente commissioni). Il pagamento comparirà qui appena registrato nel registro di bordo.</small></div>`
      : `<div class="card vsaldo ok">Hai un credito di <b class="num">${eur(-saldo)}</b> — ti torna indietro.</div>`;
  return `
    ${adminView ? `<div class="q-empty" style="margin:1.2rem 0 0">🎖️ Vista admin: stai guardando il riepilogo di ${esc(p.name)}.</div>` : ""}
    <h2>📅 Le tue date</h2>
    <div class="card">Sali a bordo l'<b>${fmt(d.board)}</b> e sbarchi il <b>${fmt(d.leave)}</b> — <b>${d.nights} notti</b>${weeks ? `: ${weeks}` : ""}.</div>
    <h2>🛏️ La tua cabina</h2>
    ${cabins ? `<div class="card">${cabins}</div>` : `<div class="q-empty">Nessuna cabina assegnata.</div>`}
    <h2>⛵ Quota barca</h2>
    <div class="card"><span class="vbig">${eur(b.quota_finale)}</span>${Math.abs((Number(b.quota_dovuta) || 0) - (Number(b.quota_finale) || 0)) > 0.01 ? `<br><small style="color:var(--soft)">quota piena ${eur(b.quota_dovuta)}, scontata a ${eur(b.quota_finale)}</small>` : ""}</div>
    <h2>🧾 I tuoi extra</h2>
    ${extras ? `<div class="card">${extras}<div class="vrow vtot"><span class="vl">Totale extra</span><span class="va">${eur(p.extras_total)}</span></div></div>` : `<div class="q-empty">Nessun extra a tuo carico.</div>`}
    <h2>💸 Le tue transazioni</h2>
    ${txs ? `<div class="card">${txs}</div>` : `<div class="q-empty">Nessun movimento registrato finora.</div>`}
    <h2>💰 Il conto</h2>
    <div class="card">
      <div class="vrow"><span class="vl">Dovuto (barca + extra)</span><span class="va">${eur(t.dovuto)}</span></div>
      <div class="vrow"><span class="vl">Versato</span><span class="va">${eur(t.versato)}</span></div>
      ${Number(t.ricevuto) > 0.005 ? `<div class="vrow"><span class="vl">Ricevuto indietro</span><span class="va pos">${eur(t.ricevuto)}</span></div>` : ""}
      <div class="vrow vtot"><span class="vl">Saldo</span><span class="va">${eur(saldo)}</span></div>
    </div>
    ${saldoCard}
    <p class="qhint" style="margin-top:1rem">Aggiornato al ${ts ? new Date(ts).toLocaleString("it", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }) : "—"}. I conti arrivano dal registro dello skipper: se qualcosa non torna, scrivigli.</p>`;
}

async function routeMe(tab) {
  const app = document.getElementById("app");
  app.innerHTML = `<section><div class="q-empty" style="margin-top:1.6rem">Un attimo — controllo chi sei…</div></section>`;
  const member = window.ninaAuth && ninaAuth.enabled ? await ninaAuth.approvedMember() : null;
  if (member && DATA.find(x => x.id === member.crew_id)) { location.replace(`#${member.crew_id}${tab ? "/" + tab : ""}`); return; }
  app.innerHTML = `<section><div class="q-empty" style="margin-top:1.6rem">${member
    ? "Non trovo la tua pagina nella ciurma — segnalalo allo skipper."
    : `🔐 Questa scorciatoia porta alla <b>tua</b> pagina — serve l'accesso all'area equipaggio.<br><a href="login.html">Accedi ›</a>`}</div></section>`;
}

let DATA = [], BOATNAME = new Map(), FLEET = new Map(), ANEC = [];
function route() {
  const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
  const [id, tab] = raw.split("/");
  if (id === "me") { routeMe(tab); return; }
  const m = DATA.find(x => x.id === id);
  // il redirect (skipper → skipper.html) salta il tab: #edo-c/viaggio resta qui
  if (m && m.crew2026 && m.crew2026.link && tab !== "viaggio") { location.replace(m.crew2026.link); return; }
  if (m && tab === "viaggio" && m.crew2026 && !m.pet) {
    document.getElementById("app").innerHTML = viaggioPage(m);
    loadViaggio(m);
  } else {
    document.getElementById("app").innerHTML = m ? memberPage(m, DATA) : directory(DATA);
    if (m && !m.pet) { QVOTES = new Map(); renderQchips(m.id); loadQualities(m.id); }
  }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
Promise.all([
  fetch("data/crew.json", { cache: "no-cache" }).then(r => r.json()),
  fetch("data/trips.json", { cache: "no-cache" }).then(r => r.json()).catch(() => ({ trips: [] })),
  fetch("data/anecdotes.json", { cache: "no-cache" }).then(r => r.json()).catch(() => ({ anecdotes: [] })),
]).then(([d, dt, da]) => {
  DATA = d.people || [];
  (dt.trips || []).forEach(t => {
    BOATNAME.set(t.id, t.name);
    (t.fleet || []).forEach(f => (f.people || []).forEach(pid => {
      if (!FLEET.has(pid)) FLEET.set(pid, []);
      FLEET.get(pid).push({ id: t.id, year: t.year, zone: t.zone, country: t.country, name: t.name, boat: t.boat, note: f.note, fleetBoat: f.boat_name });
    }));
  });
  ANEC = da.anecdotes || [];
  route();
  // schede personali (pubbliche): si caricano da Supabase e la pagina si ridisegna
  if (window.ninaAuth && ninaAuth.enabled) (async () => {
    try {
      const profiles = await ninaAuth.profilesMap();
      if (profiles) {
        PRIV = { profiles };
        const y = window.scrollY; route(); window.scrollTo(0, y);   // ridisegna senza far saltare la lettura
      }
    } catch (err) { /* Supabase giù: la pagina resta valida senza schede */ }
  })();
}).catch(() => { document.getElementById("app").innerHTML = `<section><p style="padding:2rem 0">Equipaggio non disponibile offline.</p></section>`; });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
<script src="nav.js"></script>
