name: Keep-alive Supabase

# Il progetto Supabase (free tier) si mette in pausa dopo 7 giorni senza
# richieste: cadrebbero login/area equipaggio, "Il tuo viaggio", like e qualita'
# sui profili. Fino al 2026-08-31 ci pensava il refresh del briefing ogni 3 ore
# (sospeso a crociera conclusa). Basta una chiamata REST due volte a settimana:
# nessun deploy, nessun JSON rigenerato. Senza i secret lo step avvisa e basta.
on:
  schedule:
    - cron: "17 5 * * 1,4"   # lunedi' e giovedi' 05:17 UTC: margine sul limite dei 7 giorni
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping REST Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::warning::secret Supabase assenti: nessun keep-alive eseguito"; exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "${SUPABASE_URL%/}/rest/v1/private_blobs?select=key&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY")
          echo "Supabase HTTP $code"
          test "$code" = "200"
